# SPDX-License-Identifier: BSD-3-Clause
#
# Builds and runs every example in examples/, checks the images they write
# with e2fsck -fn and debugfs, and compiles the C snippets of the READMEs
# (and checks their links). Runs `ci/run.sh examples` in the native
# container, exactly as on a developer machine; see ci/README.md.
name: Examples

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  examples:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - run: ci/run.sh examples
